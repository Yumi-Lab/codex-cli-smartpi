name: Native armv7 build

# Cross-compiles the official codex source for armv7-unknown-linux-gnueabihf and
# publishes the binary as a release of THIS repo — the native track, no emulation
# on the pad. Triggered by hand, or by the daily upstream watcher.
#
# The build runs in a Debian container on purpose: several crates in the codex
# workspace are not pure Rust (openssl-sys, libz-sys, aws-lc-sys) and need real
# armhf -dev packages, which Debian serves from the same mirror as amd64.
# Reproduce locally with the exact same command the job runs:
#   docker run --rm -v "$PWD:/repo" -w /repo rust:bookworm bash build/cross-armv7.sh
on:
  workflow_dispatch:
    inputs:
      version:
        description: "codex version (x.y.z) — empty = newest published upstream"
        required: false
      publish:
        description: "publish a GitHub Release"
        type: boolean
        default: true
      ref:
        description: "upstream git ref to build (default: the rust-vX.Y.Z tag)"
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
      publish:
        type: boolean
        default: true
      ref:
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: rust:bookworm
    # Inside a container the default shell is dash, which has no `set -o pipefail`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target version
        id: ver
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
          . lib/codex-release.sh
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(codex_latest_version)"
          [ -n "$v" ] || { echo "cannot resolve the newest codex version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building codex $v"

      # ~150 crates: without a cache every run pays the full compile. Keyed on
      # the codex version, restoring the previous run's artifacts when possible.
      - name: Restore cargo + target cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /tmp/codex-src/codex-rs/target
          key: armv7-${{ steps.ver.outputs.version }}-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            armv7-

      # Exit 78 means "this codex version cannot be built for armv7" (V8 in the
      # CLI graph). That is a fact about upstream, not a broken pipeline, so the
      # job records it and stops instead of going red every day.
      - name: Cross-compile
        id: build
        env:
          CODEX_REF: ${{ inputs.ref }}
        run: |
          set +e
          bash build/cross-armv7.sh "${{ steps.ver.outputs.version }}" "$GITHUB_WORKSPACE/dist"
          rc=$?
          if [ "$rc" -eq 78 ]; then
            echo "skipped=v8" >> "$GITHUB_OUTPUT"
            echo "::notice::codex ${{ steps.ver.outputs.version }} links V8 into the CLI — no native armv7 build is possible for this version (see docs/NATIVE-BUILD.md)"
            exit 0
          fi
          exit "$rc"

      # Which upstream commit was actually compiled — a release must never claim
      # to be version X when it was built from a branch that is ahead of X.
      - name: Record the upstream commit
        id: src
        if: steps.build.outputs.skipped != 'v8'
        run: echo "sha=$(git -C /tmp/codex-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inspect the artifact
        if: steps.build.outputs.skipped != 'v8'
        run: |
          set -euo pipefail
          ls -lh dist/
          cat dist/*.sha256
          tar -xzf dist/*.tar.gz -C /tmp
          file /tmp/codex
          # It must be a 32-bit ARM binary, or the whole point is lost.
          file -b /tmp/codex | grep -q "ELF 32-bit.*ARM" || { echo "not a 32-bit ARM binary"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.skipped != 'v8'
        with:
          name: codex-armv7-${{ steps.ver.outputs.version }}
          path: dist/*

      # Runs the freshly built armv7 binary under qemu-arm — a sanity check that
      # it starts and answers, before anyone installs it on a board. The binary
      # is dynamically linked against the armhf multiarch libraries, so the
      # sysroot is the container root, not the cross toolchain's own prefix.
      - name: Smoke test (qemu-arm)
        if: steps.build.outputs.skipped != 'v8'
        run: |
          set -uo pipefail
          apt-get install -y -qq --no-install-recommends qemu-user-static >/dev/null
          echo "--- shared libraries the binary needs"
          arm-linux-gnueabihf-readelf -d /tmp/codex | grep NEEDED || true
          out="$(qemu-arm-static -L / /tmp/codex --version 2>&1)"; rc=$?
          echo "rc=$rc out=$out"
          [ "$rc" -eq 0 ] || { echo "the binary did not run"; exit 1; }
          # `main` builds report 0.0.0, so only the product name is asserted here.
          echo "$out" | grep -qi codex

      - name: Save cargo + target cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /tmp/codex-src/codex-rs/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

    outputs:
      version: ${{ steps.ver.outputs.version }}
      skipped: ${{ steps.build.outputs.skipped }}
      sha: ${{ steps.src.outputs.sha }}

  # Publishing runs on the host (the rust image has no gh CLI) and only ever
  # touches artifacts the build job produced.
  publish:
    needs: build
    if: ${{ inputs.publish && needs.build.outputs.skipped != 'v8' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex-armv7-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$REF" ]; then
            # Built from the release tag: this IS codex $V for armv7, and
            # install.sh picks it up on its own (it looks for v<version>).
            tag="v$V"
            title="codex $V — armv7 native"
            flags=""
            notes="Native **armv7-unknown-linux-gnueabihf** build of the official [codex $V](https://github.com/openai/codex/releases/tag/rust-v$V) source (Apache-2.0), cross-compiled by [build/cross-armv7.sh](https://github.com/$REPO/blob/main/build/cross-armv7.sh).

          Installed automatically by \`install.sh\` on an armv7l board — no emulation, no qemu. Checksum in the \`.sha256\` file."
          else
            # Built from a branch: it is NOT a released version, so it gets its
            # own tag and never answers the \"is there a native build of X?\"
            # question install.sh asks. The binary reports 0.0.0 because upstream
            # only stamps versions when it tags.
            tag="snapshot-$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')-$SHA"
            title="codex snapshot $REF@$SHA — armv7 native"
            flags="--prerelease"
            for f in dist/codex-"$V"-armv7-*; do
              [ -e "$f" ] || continue
              mv "$f" "$(printf '%s' "$f" | sed "s/codex-$V-/codex-$REF-$SHA-/")"
            done
            ( cd dist && rm -f ./*.sha256 && sha256sum ./*.tar.gz > "$(ls ./*.tar.gz | sed 's|^\./||').sha256" )
            notes="Native **armv7-unknown-linux-gnueabihf** build of openai/codex at \`$REF\` (\`$SHA\`), cross-compiled by [build/cross-armv7.sh](https://github.com/$REPO/blob/main/build/cross-armv7.sh).

          **This is a snapshot of a branch, not a release.** The binary reports \`0.0.0\` — upstream stamps versions only when it tags — and \`install.sh\` will not pick it up on its own. Install it explicitly:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/$REPO/main/install.sh | \\
            CODEX_NATIVE_TARBALL=https://github.com/$REPO/releases/download/$tag/\$(ls dist/*.tar.gz | xargs -n1 basename) bash
          \`\`\`

          It exists because the newest tagged codex links V8 into the CLI, which has no armv7 build — see [docs/NATIVE-BUILD.md](https://github.com/$REPO/blob/main/docs/NATIVE-BUILD.md)."
          fi

          ls -l dist/
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$REPO"
          else
            # shellcheck disable=SC2086
            gh release create "$tag" dist/* --title "$title" --notes "$notes" $flags --repo "$REPO"
          fi
